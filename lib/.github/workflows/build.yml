name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android System
        run: |
          cp lib/main.dart main_backup.dart
          cp pubspec.yaml pubspec_backup.yaml
          flutter create --platforms=android --org com.transflow .
          cp main_backup.dart lib/main.dart
          cp pubspec_backup.yaml pubspec.yaml
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TransFlow-App
          path: build/app/outputs/flutter-apk/app-release.apk
